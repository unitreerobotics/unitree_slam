R1: ## NX mid360
  lid_topic: "rt/unitree/slam_lidar/points"  #rt/unitree/slam_lidar/points rt/utlidar/cloud_livox_mid360
  imu_topic: "rt/unitree/slam_lidar/imu"  #rt/unitree/slam_lidar/imu rt/utlidar/imu_livox_mid360
  pub_point_topic: "rt/unitree/slam_mapping/points"
  pub_odom_topic: "rt/unitree/slam_mapping/odom"
