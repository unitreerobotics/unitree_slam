R1:
  pid:
    # about pid
    ctrl_rate: 50 #hz

    # x方向
    PID_x_Limmax: 0.2
    PID_x_Vmax: 2.8
    PID_x_KP: 2.5
    PID_x_KI: 1.5
    PID_x_KD: 0.0

    # y方向
    PID_y_Limmax: 0.2
    PID_y_Vmax: 0.8
    PID_y_KP: 1.5
    PID_y_KI: 1.0
    PID_y_KD: 0.0
    # yaw
    PID_yaw_Limmax: 0.2
    PID_yaw_Vmax: 1.5
    PID_yaw_KP: 2.8
    PID_yaw_KI: 1.5
    PID_yaw_KD: 0.1

    # about threshold
    # x方向
    threshold_x: 0.02
    # y方向
    threshold_y: 0.02
    # yaw
    threshold_yaw: 0.02

  ctrl:
    CurvatureSamplingInterval: 0.2                             # 曲率离散点采样间隔   pid 巡迹使用
    # Planner 参数设置
    Planner/pub_rate: 40.0                                     # 节点发布频率
    Planner/forwardDis: 0.8 # 0.8                              # 搜索的最佳追踪点到当前位置的最远距离
    Planner/transform_tolerance: 0.05                          # 是否到达目标附近的容忍度

    speed_default: 0.5
    speed_max: 2.4
    a_max: 0.8
    omega_max: 0.5

    accurateThresholdRotate_x: 0.2
    accurateThresholdRotate_y: 0.2
    accurateThresholdRotate_yaw: 0.2

    accurateThresholdAdjust_x: 0.25
    accurateThresholdAdjust_y: 0.25
    accurateThresholdAdjust_yaw: 0.25

    accurateThresholdKeeping_x: 0.15
    accurateThresholdKeeping_y: 0.15
    accurateThresholdKeeping_yaw: 0.15


