A2:
  cloud_topic: "/lio/body_cloud"
  odom_topic: "/lio/odom"
  map_frame: "map"
  local_frame: "lidar"

  key_pose_delta_deg: 0.5
  key_pose_delta_trans: 0.1
  historyKeyframeSearchRadius: 15.0             # meters, 回环的寻找半径
  historyKeyframeSearchZ: 0.5                   # meters, 回环时，对Z轴的限制范围，默认值为 0.5
  historyKeyframeSearchTimeDiff: 30.0           # seconds, key frame that is n seconds older will be considered for loop closure
  historyKeyframeFitnessScore: 0.1
  historyKeyframeSearchNum: 25                  # number of hostory key frames will be fused into a submap for loop closure

  # loop_search_radius: 5.0
  # loop_time_tresh: 6
  # loop_score_tresh: 0.15
  # loop_submap_half_range: 5
  
  submap_resolution: 0.1
  min_loop_detect_duration: 5.0
  save_map_filter_size: 0.06

  # BoW3D
  isBow3d: false                                # whether to use Bow3D
  N_SCAN: 4
  scanPeriod: 0.1                               # horizontal angular resolution
  minimumRange: 0.1                             # point least range
  distanceTh: 0.4                               # cluster threshold
  matchTh: 6                                    # descriptors similarity dimensions
  thr: 3.5                                      # retrive ratio
  thf: 5                                        # the number of occurrences of the word
  numAddRetrieveFeatures: 5                      # retrieve features number
  frameInterval: 5                            
  matchKpts: 10
  matchCors: 50
  relaTrans: 3.0

